# CatalogueItemSpecificationUpdate
#
# UBL 2.1's own definition (UBL-CatalogueItemSpecificationUpdate-2.1.xsd): "A document
# used to update information (e.g., technical descriptions and properties) about Items in
# an existing Catalogue."
#
# `ID`, `IssueDate`, `RelatedCatalogueReference`, `ProviderParty`, `ReceiverParty` and
# `CatalogueItemSpecificationUpdateLine` are the only elements
# `CatalogueItemSpecificationUpdate` marks `required: true` at the top level (see
# src/Oasis/Doc/CatalogueItemSpecificationUpdate.php).
#
# Keys are the UBL element and attribute names, the same ones
# `Derafu\Ubl\Trait\ArraySerializableTrait::fromArray()` reads, e.g.
# `CatalogueItemSpecificationUpdate::fromArray(Yaml::parseFile(...)['CatalogueItemSpecificationUpdate'])`. A value with no attributes is a
# plain scalar (`ID`, `IssueDate`); a value that has one, like an amount's currency, needs
# the `@value`/`@attributes` form. Each field's comment below is UBL's own definition for
# it (see the `ccts:Definition` of the matching type in `resources/xsd/2.1/`), not a
# restatement of its name. A handful of required substructures UBL itself leaves with no
# required fields of their own also carry one further optional, identifying field purely
# for readability (a party's name, an item's name): everything else below is genuinely
# `required: true`.
CatalogueItemSpecificationUpdate:
  ID: '1' # An identifier for this document, assigned by the sender.
  IssueDate: '2026-01-15' # The date, assigned by the sender, on which this document was issued.
  RelatedCatalogueReference: # A reference to the Catalogue being updated.
    ID: '1' # An identifier for a specific catalogue.
    IssueDate: '2026-01-15' # The date on which the catalogue was issued.
  ProviderParty: # The party sending the Catalogue Item Specification Update.
    # A name for this party.
    PartyName:
      - Name: Acme Corp # The name of the party.
  ReceiverParty: # The party receiving the Catalogue Item Specification Update.
    # A name for this party.
    PartyName:
      - Name: Acme Corp # The name of the party.
  # One or more lines in the Catalogue Item Specification Update, each line updating a specific
  # catalogue item.
  CatalogueItemSpecificationUpdateLine:
    - ID: '1' # An identifier for the line to be updated in a catalogue.
      Item: # The catalogue item to be updated.
        # A short name optionally given to this item, such as a name from a catalogue, as distinct from a
        # description.
        Name: Widget
