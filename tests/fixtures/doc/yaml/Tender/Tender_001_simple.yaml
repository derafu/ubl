# Tender
#
# UBL 2.1's own definition (UBL-Tender-2.1.xsd): "A document whereby an economic operator
# (the tenderer) makes a formal offer (the tender) to a contracting authority to execute
# an order for the supply or purchase of goods, or for the execution of work, according to
# the terms of a proposed contract."
#
# `ID`, `ContractFolderID`, `IssueDate`, `TendererParty` and `TenderedProject` are the
# only elements `Tender` marks `required: true` at the top level (see
# src/Oasis/Doc/Tender.php).
#
# Keys are the UBL element and attribute names, the same ones
# `Derafu\Ubl\Trait\ArraySerializableTrait::fromArray()` reads, e.g.
# `Tender::fromArray(Yaml::parseFile(...)['Tender'])`. A value with no attributes is a
# plain scalar (`ID`, `IssueDate`); a value that has one, like an amount's currency, needs
# the `@value`/`@attributes` form. Each field's comment below is UBL's own definition for
# it (see the `ccts:Definition` of the matching type in `resources/xsd/2.1/`), not a
# restatement of its name. A handful of required substructures UBL itself leaves with no
# required fields of their own also carry one further optional, identifying field purely
# for readability (a party's name, an item's name): everything else below is genuinely
# `required: true`.
Tender:
  ID: '1' # An identifier for this document, assigned by the sender.
  # An identifier, assigned by the sender, for the process file (i.e., record) to which this
  # document belongs.
  ContractFolderID: '1'
  IssueDate: '2026-01-15' # The date, assigned by the sender, on which this document was issued.
  TendererParty: # The primary tenderer.
    # A name for this party.
    PartyName:
      - Name: Acme Corp # The name of the party.
  # A project with which this Tender is associated. A single Tender can be used to bid for one
  # project, multiple projects, or the global project.
  TenderedProject:
    - {}
