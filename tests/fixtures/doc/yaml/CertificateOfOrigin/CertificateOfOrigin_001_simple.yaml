# CertificateOfOrigin
#
# UBL 2.1's own definition (UBL-CertificateOfOrigin-2.1.xsd): "A document that describes
# the Certificate of Origin."
#
# `ID`, `CertificateOfOriginApplication` and `IssuerEndorsement` are the only elements
# `CertificateOfOrigin` marks `required: true` at the top level (see
# src/Oasis/Doc/CertificateOfOrigin.php). `IssueDate` is optional here, but included
# anyway for readability.
#
# The structure is the model-based JSON representation of OASIS's "UBL 2.1 JSON Alternative
# Representation" (Committee Note v2.0), carried as YAML: the keys are the UBL element names
# (the same ones `Derafu\Ubl\Trait\ArraySerializableTrait::fromArray()` reads, e.g.
# `Invoice::fromArray(Yaml::parseFile(...)['Invoice'])`), a value (a BBIE) is always an object
# with its content under `_` and its attributes (an amount's currency) next to it, and only what
# UBL allows more than once is a list. `_D`, `_A` and `_B` are the namespaces of the apex.
#
# Each field's comment below is UBL's own definition for
# it (see the `ccts:Definition` of the matching type in `resources/xsd/2.1/`), not a
# restatement of its name. A handful of required substructures UBL itself leaves with no
# required fields of their own also carry one further optional, identifying field purely
# for readability (a party's name, an item's name): everything else below is genuinely
# `required: true`.
_D: urn:oasis:names:specification:ubl:schema:xsd:CertificateOfOrigin-2
_A: urn:oasis:names:specification:ubl:schema:xsd:CommonAggregateComponents-2
_B: urn:oasis:names:specification:ubl:schema:xsd:CommonBasicComponents-2
CertificateOfOrigin:
  ID: # An identifier for this document, assigned by the sender.
    _: '1'
  IssueDate: # The date, assigned by the sender, on which this document was issued.
    _: '2026-01-15'
  CertificateOfOriginApplication: # Details of the application for a Certificate of Origin.
    ReferenceID: # An identifier for a reference as part of the CoO application.
      _: '1'
    CertificateType: # The type of CoO being applied for (Ordinary, Re-export, Commonwealth Preferential, etc.).
      _: Certificate of Origin
    # The latest job number given to the CoO application. This is used by the system to keep track of
    # amendments to or cancellation of any earlier applications.
    OriginalJobID:
      _: '1'
    Shipment: # The shipment of goods covered by the CoO.
      ID: # An identifier for this shipment.
        _: '1'
    # A party providing an endorsement to the CoO.
    EndorserParty:
      - # A code specifying the role of the party providing the endorsement (e.g., issuer, embassy,
        # insurance, etc.).
        RoleCode:
          _: '1'
        # A number indicating the order of the endorsement provided by this party in the sequence in
        # which endorsements are to be applied.
        SequenceNumeric:
          _: 1
        Party: # The party endorsing the application.
          # A name for this party.
          PartyName:
            - Name: # The name of the party.
                _: Acme Corp
        # The individual representing the exporter who signs the Certificate of Origin application before
        # submitting it to the issuer party.
        SignatoryContact: {}
    PreparationParty: # The party (individual, group, or body) that prepared this CoO application.
      # A name for this party.
      PartyName:
        - Name: # The name of the party.
            _: Acme Corp
    IssuerParty: # The organization authorized to issue the CoO requested by this application.
      # A name for this party.
      PartyName:
        - Name: # The name of the party.
            _: Acme Corp
    IssuingCountry: {} # The country where the requested CoO will be issued.
  IssuerEndorsement: # Issuer Endorsement details.
    DocumentID: # An identifier for this endorsement.
      _: '1'
    ApprovalStatus: # The status of this endorsement.
      _: Approved
    EndorserParty: # The type of party providing this endorsement.
      # A code specifying the role of the party providing the endorsement (e.g., issuer, embassy,
      # insurance, etc.).
      RoleCode:
        _: '1'
      # A number indicating the order of the endorsement provided by this party in the sequence in
      # which endorsements are to be applied.
      SequenceNumeric:
        _: 1
      Party: # The party endorsing the application.
        # A name for this party.
        PartyName:
          - Name: # The name of the party.
              _: Acme Corp
      # The individual representing the exporter who signs the Certificate of Origin application before
      # submitting it to the issuer party.
      SignatoryContact: {}
