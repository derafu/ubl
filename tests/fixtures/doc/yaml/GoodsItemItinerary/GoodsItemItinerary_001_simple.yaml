# GoodsItemItinerary
#
# UBL 2.1's own definition (UBL-GoodsItemItinerary-2.1.xsd): "A document providing details
# relating to a transport service, such as transport movement, identification of equipment
# and goods, subcontracted service providers, etc."
#
# `ID`, `IssueDate`, `IssueTime`, `VersionID`, `TransportExecutionPlanReferenceID` and
# `TransportationSegment` are the only elements `GoodsItemItinerary` marks `required:
# true` at the top level (see src/Oasis/Doc/GoodsItemItinerary.php).
#
# The structure is the model-based JSON representation of OASIS's "UBL 2.1 JSON Alternative
# Representation" (Committee Note v2.0), carried as YAML: the keys are the UBL element names
# (the same ones `Derafu\Ubl\Trait\ArraySerializableTrait::fromArray()` reads, e.g.
# `Invoice::fromArray(Yaml::parseFile(...)['Invoice'])`), a value (a BBIE) is always an object
# with its content under `_` and its attributes (an amount's currency) next to it, and only what
# UBL allows more than once is a list. `_D`, `_A` and `_B` are the namespaces of the apex.
#
# Each field's comment below is UBL's own definition for
# it (see the `ccts:Definition` of the matching type in `resources/xsd/2.1/`), not a
# restatement of its name. A handful of required substructures UBL itself leaves with no
# required fields of their own also carry one further optional, identifying field purely
# for readability (a party's name, an item's name): everything else below is genuinely
# `required: true`.
_D: urn:oasis:names:specification:ubl:schema:xsd:GoodsItemItinerary-2
_A: urn:oasis:names:specification:ubl:schema:xsd:CommonAggregateComponents-2
_B: urn:oasis:names:specification:ubl:schema:xsd:CommonBasicComponents-2
GoodsItemItinerary:
  ID: # An identifier for this document, assigned by the sender.
    _: '1'
  IssueDate: # The date, assigned by the sender, on which this document was issued.
    _: '2026-01-15'
  IssueTime: # The time, assigned by the sender, at which this document was issued.
    _: 00:00:00-03:00
  VersionID: # Identifies a version of a Goods Item Itinerary in order to distinguish updates.
    _: '1'
  TransportExecutionPlanReferenceID: # The Transport Execution Plan associated with this Goods Item Itinerary.
    _: '1'
  # A part of a transport service that has its own Transport Execution Plan. A Transportation
  # Segment may cover services other than transport, such as terminal handling, document
  # management, customs procedures, etc.
  TransportationSegment:
    - # A number indicating the order of this segment in the sequence of transportation segments making
      # up a transportation service.
      SequenceNumeric:
        _: 1
      TransportationService: # The transportation service used in this transportation segment.
        TransportServiceCode: # A code signifying the extent of this transportation service (e.g., door-to-door, port-to-port).
          _: '1'
      # The transport service provider responsible for carrying out transportation services in this
      # transportation segment.
      TransportServiceProviderParty:
        # A name for this party.
        PartyName:
          - Name: # The name of the party.
              _: Acme Corp
