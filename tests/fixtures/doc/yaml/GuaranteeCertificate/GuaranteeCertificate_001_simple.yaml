# GuaranteeCertificate
#
# UBL 2.1's own definition (UBL-GuaranteeCertificate-2.1.xsd): "A document to notify the
# deposit of a bid bond guarantee."
#
# `ContractFolderID`, `IssueDate`, `LiabilityAmount`, `Signature`, `GuarantorParty` and
# `InterestedParty` are the only elements `GuaranteeCertificate` marks `required: true` at
# the top level (see src/Oasis/Doc/GuaranteeCertificate.php).
#
# Keys are the UBL element and attribute names, the same ones
# `Derafu\Ubl\Trait\ArraySerializableTrait::fromArray()` reads, e.g.
# `GuaranteeCertificate::fromArray(Yaml::parseFile(...)['GuaranteeCertificate'])`. A value with no attributes is a
# plain scalar (`ID`, `IssueDate`); a value that has one, like an amount's currency, needs
# the `@value`/`@attributes` form. Each field's comment below is UBL's own definition for
# it (see the `ccts:Definition` of the matching type in `resources/xsd/2.1/`), not a
# restatement of its name. A handful of required substructures UBL itself leaves with no
# required fields of their own also carry one further optional, identifying field purely
# for readability (a party's name, an item's name): everything else below is genuinely
# `required: true`.
GuaranteeCertificate:
  # An identifier, assigned by the sender, for the process file (i.e., record) to which this
  # document belongs.
  ContractFolderID: '1'
  IssueDate: '2026-01-15' # The date, assigned by the sender, on which this document was issued.
  LiabilityAmount: # The liability amount (a monetary value) in the bid bond guarantee.
    '@value': '100'
    '@attributes':
      currencyID: EUR
  # A signature applied to this document.
  Signature:
    - ID: '1' # An identifier for this signature.
  GuarantorParty: # The guarantee creditor organization that has the authority to charge bid bond guarantee credit.
    # A name for this party.
    PartyName:
      - Name: Acme Corp # The name of the party.
  InterestedParty: # The party depositing the bid bond guarantee.
    # A name for this party.
    PartyName:
      - Name: Acme Corp # The name of the party.
