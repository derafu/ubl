# ItemInformationRequest
#
# UBL 2.1's own definition (UBL-ItemInformationRequest-2.1.xsd): "A document used to
# request product activity, forecast, or performance data."
#
# `ID`, `IssueDate`, `Period`, `SenderParty`, `ReceiverParty` and
# `ItemInformationRequestLine` are the only elements `ItemInformationRequest` marks
# `required: true` at the top level (see src/Oasis/Doc/ItemInformationRequest.php).
#
# Keys are the UBL element and attribute names, the same ones
# `Derafu\Ubl\Trait\ArraySerializableTrait::fromArray()` reads, e.g.
# `ItemInformationRequest::fromArray(Yaml::parseFile(...)['ItemInformationRequest'])`. A value with no attributes is a
# plain scalar (`ID`, `IssueDate`); a value that has one, like an amount's currency, needs
# the `@value`/`@attributes` form. Each field's comment below is UBL's own definition for
# it (see the `ccts:Definition` of the matching type in `resources/xsd/2.1/`), not a
# restatement of its name. A handful of required substructures UBL itself leaves with no
# required fields of their own also carry one further optional, identifying field purely
# for readability (a party's name, an item's name): everything else below is genuinely
# `required: true`.
ItemInformationRequest:
  ID: '1' # An identifier for this document, assigned by the sender.
  IssueDate: '2026-01-15' # The date, assigned by the sender, on which this document was issued.
  Period: # The period of time to which the Item Information Request applies.
    StartDate: '2026-01-15' # The date on which this period begins.
  SenderParty: # The buyer.
    # A name for this party.
    PartyName:
      - Name: Acme Corp # The name of the party.
  ReceiverParty: # The seller.
    # A name for this party.
    PartyName:
      - Name: Acme Corp # The name of the party.
  # A line requesting information regarding an item of sale.
  ItemInformationRequestLine:
    - # A period for which this information is requested.
      Period:
        - StartDate: '2026-01-15' # The date on which this period begins.
      # Sales information for the item to which this line applies.
      SalesItem:
        - Quantity: '1' # The quantity the given information are related to
          Item: # The sales item itself.
            # A short name optionally given to this item, such as a name from a catalogue, as distinct from a
            # description.
            Name: Widget
