# InventoryReport
#
# UBL 2.1's own definition (UBL-InventoryReport-2.1.xsd): "A report on the quantities of
# each item that are, or will be, in stock. This document is sent by a Buyer (for example
# a retailer) to a Seller (for example a producer)."
#
# `ID`, `IssueDate`, `RetailerCustomerParty`, `InventoryReportingParty` and
# `InventoryReportLine` are the only elements `InventoryReport` marks `required: true` at
# the top level (see src/Oasis/Doc/InventoryReport.php).
#
# Keys are the UBL element and attribute names, the same ones
# `Derafu\Ubl\Trait\ArraySerializableTrait::fromArray()` reads, e.g.
# `InventoryReport::fromArray(Yaml::parseFile(...)['InventoryReport'])`. A value with no attributes is a
# plain scalar (`ID`, `IssueDate`); a value that has one, like an amount's currency, needs
# the `@value`/`@attributes` form. Each field's comment below is UBL's own definition for
# it (see the `ccts:Definition` of the matching type in `resources/xsd/2.1/`), not a
# restatement of its name. A handful of required substructures UBL itself leaves with no
# required fields of their own also carry one further optional, identifying field purely
# for readability (a party's name, an item's name): everything else below is genuinely
# `required: true`.
InventoryReport:
  ID: '1' # An identifier for the Inventory Report, assigned by the Issuer.
  IssueDate: '2026-01-15' # The date, assigned by the sender, on which this document was issued.
  RetailerCustomerParty: # The retailer, who sends this message.
    Party: # The customer party itself.
      # A name for this party.
      PartyName:
        - Name: Acme Corp # The name of the party.
  # An association to the Party that will really use the Inventory report (normally the branch for
  # which the stock is reported).
  InventoryReportingParty:
    # A name for this party.
    PartyName:
      - Name: Acme Corp # The name of the party.
  # A line representing a particular item of sale and associated with a line in the Catalogue.
  InventoryReportLine:
    - ID: '1' # An identifier for this inventory report line.
      Quantity: '1' # The quantity of the item reported that is currently in stock.
      Item: # The item associated with this inventory report line.
        # A short name optionally given to this item, such as a name from a catalogue, as distinct from a
        # description.
        Name: Widget
