# UtilityStatement
#
# UBL 2.1's own definition (UBL-UtilityStatement-2.1.xsd): "A supplement to an Invoice or
# Credit Note, containing information on the consumption of services provided by utility
# suppliers to private and public customers, including electricity, gas, water, and
# telephone services."
#
# `ID`, `IssueDate`, `UtilityStatementTypeCode`, `DocumentCurrencyCode`,
# `ParentDocumentReference`, `SenderParty` and `ReceiverParty` are the only elements
# `UtilityStatement` marks `required: true` at the top level (see
# src/Oasis/Doc/UtilityStatement.php).
#
# Keys are the UBL element and attribute names, the same ones
# `Derafu\Ubl\Trait\ArraySerializableTrait::fromArray()` reads, e.g.
# `UtilityStatement::fromArray(Yaml::parseFile(...)['UtilityStatement'])`. A value with no attributes is a
# plain scalar (`ID`, `IssueDate`); a value that has one, like an amount's currency, needs
# the `@value`/`@attributes` form. Each field's comment below is UBL's own definition for
# it (see the `ccts:Definition` of the matching type in `resources/xsd/2.1/`), not a
# restatement of its name. A handful of required substructures UBL itself leaves with no
# required fields of their own also carry one further optional, identifying field purely
# for readability (a party's name, an item's name): everything else below is genuinely
# `required: true`.
UtilityStatement:
  ID: '1' # An identifier for this document, assigned by the sender.
  IssueDate: '2026-01-15' # The date, assigned by the sender, on which this document was issued.
  UtilityStatementTypeCode: '1' # A code signifying the type of Utility Statement.
  DocumentCurrencyCode: EUR # A code signifying the default currency for this document.
  ParentDocumentReference: # A reference to the parent Invoice or Credit Note.
    ID: '1' # An identifier for the referenced document.
    IssueDate: '2026-01-15' # The date, assigned by the sender of the referenced document, on which the document was issued.
  SenderParty: # The party sending this document.
    # A name for this party.
    PartyName:
      - Name: Acme Corp # The name of the party.
  ReceiverParty: # The party receiving this document.
    # A name for this party.
    PartyName:
      - Name: Acme Corp # The name of the party.
