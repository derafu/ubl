# TendererQualificationResponse
#
# UBL 2.1's own definition (UBL-TendererQualificationResponse-2.1.xsd): "A document issued
# by a procurement organization to notify an economic operator whether it has been
# admitted to or excluded from the tendering process."
#
# `ContractFolderID`, `IssueDate`, `SenderParty`, `ReceiverParty` and
# `QualificationResolution` are the only elements `TendererQualificationResponse` marks
# `required: true` at the top level (see src/Oasis/Doc/TendererQualificationResponse.php).
#
# Keys are the UBL element and attribute names, the same ones
# `Derafu\Ubl\Trait\ArraySerializableTrait::fromArray()` reads, e.g.
# `TendererQualificationResponse::fromArray(Yaml::parseFile(...)['TendererQualificationResponse'])`. A value with no attributes is a
# plain scalar (`ID`, `IssueDate`); a value that has one, like an amount's currency, needs
# the `@value`/`@attributes` form. Each field's comment below is UBL's own definition for
# it (see the `ccts:Definition` of the matching type in `resources/xsd/2.1/`), not a
# restatement of its name. A handful of required substructures UBL itself leaves with no
# required fields of their own also carry one further optional, identifying field purely
# for readability (a party's name, an item's name): everything else below is genuinely
# `required: true`.
TendererQualificationResponse:
  # An identifier, assigned by the sender, for the process file (i.e., record) to which this
  # document belongs.
  ContractFolderID: '1'
  IssueDate: '2026-01-15' # The date, assigned by the sender, on which this document was issued.
  SenderParty: # The party sending this message.
    # A name for this party.
    PartyName:
      - Name: Acme Corp # The name of the party.
  ReceiverParty: # The party receiving this message.
    # A name for this party.
    PartyName:
      - Name: Acme Corp # The name of the party.
  # An association to the resolution that is being notified
  QualificationResolution:
    - # An indicator that the economic operator has been accepted into the tendering process (true) or
      # rejected from the tendering process (false).
      AdmissionCode: '1'
      ResolutionDate: '2026-01-15' # The date on which this qualification resolution was formalized.
