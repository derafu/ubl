# Forecast
#
# UBL 2.1's own definition (UBL-Forecast-2.1.xsd): "A document used to forecast sales or
# orders."
#
# `ID`, `IssueDate`, `ForecastPurposeCode`, `ForecastPeriod`, `SenderParty`,
# `ReceiverParty` and `ForecastLine` are the only elements `Forecast` marks `required:
# true` at the top level (see src/Oasis/Doc/Forecast.php).
#
# Keys are the UBL element and attribute names, the same ones
# `Derafu\Ubl\Trait\ArraySerializableTrait::fromArray()` reads, e.g.
# `Forecast::fromArray(Yaml::parseFile(...)['Forecast'])`. A value with no attributes is a
# plain scalar (`ID`, `IssueDate`); a value that has one, like an amount's currency, needs
# the `@value`/`@attributes` form. Each field's comment below is UBL's own definition for
# it (see the `ccts:Definition` of the matching type in `resources/xsd/2.1/`), not a
# restatement of its name. A handful of required substructures UBL itself leaves with no
# required fields of their own also carry one further optional, identifying field purely
# for readability (a party's name, an item's name): everything else below is genuinely
# `required: true`.
Forecast:
  ID: '1' # An identifier for this document, assigned by the sender.
  IssueDate: '2026-01-15' # The date, assigned by the sender, on which this document was issued.
  ForecastPurposeCode: '1' # A code signifying the purpose of the Forecast document.
  ForecastPeriod: # The period to which the Forecast applies.
    StartDate: '2026-01-15' # The date on which this period begins.
  SenderParty: # The party sending this document.
    # A name for this party.
    PartyName:
      - Name: Acme Corp # The name of the party.
  ReceiverParty: # The party receiving this document.
    # A name for this party.
    PartyName:
      - Name: Acme Corp # The name of the party.
  # A Forecast Line.
  ForecastLine:
    - ID: '1' # An identifier for this forecast line.
      ForecastTypeCode: '1' # A code signifying the type of forecast. Examples: BASE PROMOTIONAL SEASONAL TOTAL
