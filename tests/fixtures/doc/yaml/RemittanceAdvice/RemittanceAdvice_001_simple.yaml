# RemittanceAdvice
#
# UBL 2.1's own definition (UBL-RemittanceAdvice-2.1.xsd): "A document that specifies
# details of an actual payment."
#
# `ID`, `IssueDate`, `AccountingCustomerParty`, `AccountingSupplierParty` and
# `RemittanceAdviceLine` are the only elements `RemittanceAdvice` marks `required: true`
# at the top level (see src/Oasis/Doc/RemittanceAdvice.php).
#
# Keys are the UBL element and attribute names, the same ones
# `Derafu\Ubl\Trait\ArraySerializableTrait::fromArray()` reads, e.g.
# `RemittanceAdvice::fromArray(Yaml::parseFile(...)['RemittanceAdvice'])`. A value with no attributes is a
# plain scalar (`ID`, `IssueDate`); a value that has one, like an amount's currency, needs
# the `@value`/`@attributes` form. Each field's comment below is UBL's own definition for
# it (see the `ccts:Definition` of the matching type in `resources/xsd/2.1/`), not a
# restatement of its name. A handful of required substructures UBL itself leaves with no
# required fields of their own also carry one further optional, identifying field purely
# for readability (a party's name, an item's name): everything else below is genuinely
# `required: true`.
RemittanceAdvice:
  ID: '1' # An identifier for this document, assigned by the sender.
  IssueDate: '2026-01-15' # The date, assigned by the sender, on which this document was issued.
  AccountingCustomerParty: # The accounting customer party.
    Party: # The customer party itself.
      # A name for this party.
      PartyName:
        - Name: Acme Corp # The name of the party.
  AccountingSupplierParty: # The accounting supplier party.
    Party: # The supplier party itself.
      # A name for this party.
      PartyName:
        - Name: Acme Corp # The name of the party.
  # A line specifying a balance.
  RemittanceAdviceLine:
    - ID: '1' # An identifier for this remittance advice line.
