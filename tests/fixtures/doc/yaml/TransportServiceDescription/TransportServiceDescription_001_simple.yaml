# TransportServiceDescription
#
# UBL 2.1's own definition (UBL-TransportServiceDescription-2.1.xsd): "A document sent by
# a transport service provider to announce the availability of a transport service."
#
# `ID` is the only element `TransportServiceDescription` marks `required: true` at the top
# level (see src/Oasis/Doc/TransportServiceDescription.php). `IssueDate` is optional here,
# but included anyway for readability.
#
# Keys are the UBL element and attribute names, the same ones
# `Derafu\Ubl\Trait\ArraySerializableTrait::fromArray()` reads, e.g.
# `TransportServiceDescription::fromArray(Yaml::parseFile(...)['TransportServiceDescription'])`. A value with no attributes is a
# plain scalar (`ID`, `IssueDate`); a value that has one, like an amount's currency, needs
# the `@value`/`@attributes` form. Each field's comment below is UBL's own definition for
# it (see the `ccts:Definition` of the matching type in `resources/xsd/2.1/`), not a
# restatement of its name. A handful of required substructures UBL itself leaves with no
# required fields of their own also carry one further optional, identifying field purely
# for readability (a party's name, an item's name): everything else below is genuinely
# `required: true`.
TransportServiceDescription:
  ID: '1' # An identifier for this document, assigned by the sender.
  IssueDate: '2026-01-15' # The date, assigned by the sender, on which this document was issued.
