# WasteNotification
#
# UBL 2.5's own definition (UBL-WasteNotification-2.5.xsd): "A document used to notify the competent authorities of planned movements of waste."
#
# Only what `WasteNotification` marks `required: true` (see src/V25/Oasis/Doc/WasteNotification.php)
# is here: the smallest document of the model, written by tools/generate-yaml-fixtures.php.
#
# The structure is the model-based JSON representation of OASIS's "UBL JSON Alternative
# Representation" (Committee Note), carried as YAML: the keys are the UBL element names, a value
# (a BBIE) is always an object with its content under `_` and its attributes next to it, and only
# what UBL allows more than once is a list. `_D`, `_A` and `_B` are the namespaces of the apex.
#
# Each field's comment is UBL's own definition of it (the `ccts:Definition` of the XSD).
_D: urn:oasis:names:specification:ubl:schema:xsd:WasteNotification-2
_A: urn:oasis:names:specification:ubl:schema:xsd:CommonAggregateComponents-2
_B: urn:oasis:names:specification:ubl:schema:xsd:CommonBasicComponents-2
WasteNotification:
  ID: # An identifier for this document, assigned by the sender.
    _: '1'
  IssueDate: # The date, assigned by the sender, on which this document was issued.
    _: '2026-01-15'
  SenderParty: {} # The Party sending this document.
  ReceiverParty: {} # The Party receiving this document.
  NotifierParty: {} # The Party responsible for providing the Waste Notification information and acting in the role of notifier in the waste movement process.
  CustomsParty: # The competent authority granting a permit to export or import the waste.
    - {}
  WasteProducerParty: {} # The Party producing the waste material.
  Shipment: {} # The relevant shipment information describing the planned transport and the waste material.
