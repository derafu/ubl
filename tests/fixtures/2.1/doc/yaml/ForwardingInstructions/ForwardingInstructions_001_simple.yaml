# ForwardingInstructions
#
# UBL 2.1's own definition (UBL-ForwardingInstructions-2.1.xsd): "A document issued to a
# forwarder, giving instructions regarding the action to be taken for the forwarding of
# goods described therein. Forwarding Instructions is used by any party who gives
# instructions for the transportation services required for a consignment of goods to any
# party who is contracted to provide the transportation services. The parties who issue
# this document are commonly referred to as the shipper or consignor, while the parties
# who receive this document are forwarders, carriers, shipping agents, etc. This document
# may also be issued by a forwarder or shipping agent in its capacity as a shipper. This
# document can be used to arrange for the transportation (1) of different types of goods
# or cargoes; (2) whether containerized or non-containerized; (3) through different modes
# of transport including multi-modal; and (4) from any origin to any destination."
#
# `ID` and `Shipment` are the only elements `ForwardingInstructions` marks `required:
# true` at the top level (see src/Oasis/Doc/ForwardingInstructions.php). `IssueDate` is
# optional here, but included anyway for readability.
#
# The structure is the model-based JSON representation of OASIS's "UBL 2.1 JSON Alternative
# Representation" (Committee Note v2.0), carried as YAML: the keys are the UBL element names
# (the same ones `Derafu\Ubl\Trait\ArraySerializableTrait::fromArray()` reads, e.g.
# `Invoice::fromArray(Yaml::parseFile(...)['Invoice'])`), a value (a BBIE) is always an object
# with its content under `_` and its attributes (an amount's currency) next to it, and only what
# UBL allows more than once is a list. `_D`, `_A` and `_B` are the namespaces of the apex.
#
# Each field's comment below is UBL's own definition for
# it (see the `ccts:Definition` of the matching type in `resources/xsd/2.1/`), not a
# restatement of its name. A handful of required substructures UBL itself leaves with no
# required fields of their own also carry one further optional, identifying field purely
# for readability (a party's name, an item's name): everything else below is genuinely
# `required: true`.
_D: urn:oasis:names:specification:ubl:schema:xsd:ForwardingInstructions-2
_A: urn:oasis:names:specification:ubl:schema:xsd:CommonAggregateComponents-2
_B: urn:oasis:names:specification:ubl:schema:xsd:CommonBasicComponents-2
ForwardingInstructions:
  ID: # An identifier for this document, assigned by the sender.
    _: '1'
  IssueDate: # The date, assigned by the sender, on which this document was issued.
    _: '2026-01-15'
  # An identifiable collection of one or more goods items to be transported between the seller
  # party and the buyer party.
  Shipment:
    ID: # An identifier for this shipment.
      _: '1'
