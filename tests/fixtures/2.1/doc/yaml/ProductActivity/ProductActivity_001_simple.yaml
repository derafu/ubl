# ProductActivity
#
# UBL 2.1's own definition (UBL-ProductActivity-2.1.xsd): "A document reporting the
# movement of goods at specified retail locations for inventory tracking purposes."
#
# `ID`, `IssueDate`, `ActivityPeriod`, `SenderParty`, `ReceiverParty` and
# `SupplyChainActivityDataLine` are the only elements `ProductActivity` marks `required:
# true` at the top level (see src/Oasis/Doc/ProductActivity.php).
#
# The structure is the model-based JSON representation of OASIS's "UBL 2.1 JSON Alternative
# Representation" (Committee Note v2.0), carried as YAML: the keys are the UBL element names
# (the same ones `Derafu\Ubl\Trait\ArraySerializableTrait::fromArray()` reads, e.g.
# `Invoice::fromArray(Yaml::parseFile(...)['Invoice'])`), a value (a BBIE) is always an object
# with its content under `_` and its attributes (an amount's currency) next to it, and only what
# UBL allows more than once is a list. `_D`, `_A` and `_B` are the namespaces of the apex.
#
# Each field's comment below is UBL's own definition for
# it (see the `ccts:Definition` of the matching type in `resources/xsd/2.1/`), not a
# restatement of its name. A handful of required substructures UBL itself leaves with no
# required fields of their own also carry one further optional, identifying field purely
# for readability (a party's name, an item's name): everything else below is genuinely
# `required: true`.
_D: urn:oasis:names:specification:ubl:schema:xsd:ProductActivity-2
_A: urn:oasis:names:specification:ubl:schema:xsd:CommonAggregateComponents-2
_B: urn:oasis:names:specification:ubl:schema:xsd:CommonBasicComponents-2
ProductActivity:
  ID: # An identifier for this document, assigned by the sender.
    _: '1'
  IssueDate: # The date, assigned by the sender, on which this document was issued.
    _: '2026-01-15'
  ActivityPeriod: # The period covered by this Product Activity report.
    StartDate: # The date on which this period begins.
      _: '2026-01-15'
  SenderParty: # The sender of the Product Activity.
    # A name for this party.
    PartyName:
      - Name: # The name of the party.
          _: Acme Corp
  ReceiverParty: # The receiver of the Product Activity.
    # A name for this party.
    PartyName:
      - Name: # The name of the party.
          _: Acme Corp
  # A line describing the movement of goods to a specific location.
  SupplyChainActivityDataLine:
    - ID: # An identifier for this activity data line.
        _: '1'
      SupplyChainActivityTypeCode: # A code signifying the type of supply chain activity.
        _: '1'
      # Either the location where the movement of goods is observed or the location from which the
      # goods are moved.
      ActivityOriginLocation: {}
      # Sales information for an item to which this line applies.
      SalesItem:
        - Quantity: # The quantity the given information are related to
            _: 1
          Item: # The sales item itself.
            # A short name optionally given to this item, such as a name from a catalogue, as distinct from a
            # description.
            Name:
              _: Widget
