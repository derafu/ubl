# DebitNote
#
# UBL 2.1's own definition (UBL-DebitNote-2.1.xsd): "A document used to specify debts
# incurred by the Debtor."
#
# `ID`, `IssueDate`, `AccountingSupplierParty`, `AccountingCustomerParty`,
# `RequestedMonetaryTotal` and `DebitNoteLine` are the only elements `DebitNote` marks
# `required: true` at the top level (see src/Oasis/Doc/DebitNote.php).
#
# The structure is the model-based JSON representation of OASIS's "UBL 2.1 JSON Alternative
# Representation" (Committee Note v2.0), carried as YAML: the keys are the UBL element names
# (the same ones `Derafu\Ubl\Trait\ArraySerializableTrait::fromArray()` reads, e.g.
# `Invoice::fromArray(Yaml::parseFile(...)['Invoice'])`), a value (a BBIE) is always an object
# with its content under `_` and its attributes (an amount's currency) next to it, and only what
# UBL allows more than once is a list. `_D`, `_A` and `_B` are the namespaces of the apex.
#
# Each field's comment below is UBL's own definition for
# it (see the `ccts:Definition` of the matching type in `resources/xsd/2.1/`), not a
# restatement of its name. A handful of required substructures UBL itself leaves with no
# required fields of their own also carry one further optional, identifying field purely
# for readability (a party's name, an item's name): everything else below is genuinely
# `required: true`.
_D: urn:oasis:names:specification:ubl:schema:xsd:DebitNote-2
_A: urn:oasis:names:specification:ubl:schema:xsd:CommonAggregateComponents-2
_B: urn:oasis:names:specification:ubl:schema:xsd:CommonBasicComponents-2
DebitNote:
  ID: # An identifier for this document, assigned by the sender.
    _: '1'
  IssueDate: # The date, assigned by the sender, on which this document was issued.
    _: '2026-01-15'
  AccountingSupplierParty: # The accounting supplier party.
    Party: # The supplier party itself.
      # A name for this party.
      PartyName:
        - Name: # The name of the party.
            _: Acme Corp
  AccountingCustomerParty: # The accounting customer party.
    Party: # The customer party itself.
      # A name for this party.
      PartyName:
        - Name: # The name of the party.
            _: Acme Corp
  RequestedMonetaryTotal: # The total amount payable on the Debit Note, including allowances, charges, and taxes.
    PayableAmount: # The amount of the monetary total to be paid.
      _: 100
      currencyID: EUR
  # A Debit Note line.
  DebitNoteLine:
    - ID: # An identifier for this debit note line.
        _: '1'
      LineExtensionAmount: # The total amount for this debit note line, including allowance charges but net of taxes.
        _: 100
        currencyID: EUR
