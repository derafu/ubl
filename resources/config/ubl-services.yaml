# Optional wiring for apps using symfony/dependency-injection.
# Import it from your own services.yaml:
#
#   imports:
#       - { resource: '../vendor/derafu/ubl/resources/config/ubl-services.yaml' }

parameters:
    # The UBL version that is used when a call does not ask for one (see VersionRegistry).
    # 2.1 is the version of Peppol BIS Billing 3.0. Override it in your own services.yaml.
    derafu.ubl.version: '2.1'

services:

    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Derafu\Ubl\Contract\SerializerInterface:
        class: Derafu\Ubl\Service\Serializer

    Derafu\Ubl\Contract\DeserializerInterface:
        class: Derafu\Ubl\Service\Deserializer

    Derafu\Ubl\Contract\VersionRegistryInterface:
        class: Derafu\Ubl\Service\VersionRegistry
        arguments:
            $default: '%derafu.ubl.version%'

    Derafu\Ubl\Contract\XmlValidatorInterface:
        class: Derafu\Ubl\Service\XmlSchemaValidator

    # Needs opis/json-schema (only suggested) when validation of JSON or YAML is requested.
    Derafu\Ubl\Contract\JsonValidatorInterface:
        class: Derafu\Ubl\Service\JsonSchemaValidator

    Derafu\Ubl\Contract\NormalizerInterface:
        class: Derafu\Ubl\Service\Normalizer

    # The codecs of the extensions: a package that knows an extension registers its
    # `ExtensionContentCodecInterface` with the tag `derafu_ubl.extension_content_codec`
    # (explicit in its own file: `_instanceof` does not propagate across imported files).
    Derafu\Ubl\Service\ExtensionContentCodecs:
        arguments:
            $codecs: !tagged_iterator derafu_ubl.extension_content_codec

    Derafu\Ubl\Contract\FormatHandlerFactoryInterface:
        class: Derafu\Ubl\Service\FormatHandlerFactory

    # Feeds resources/translations into the consuming app's Translator (the
    # app must pass $resourceProviders: !tagged_iterator
    # derafu_translation.resource_provider to TranslatorFactory::create(),
    # see derafu/translation's translation-services.yaml). The tag is
    # explicit because _instanceof does not propagate across imported files.
    Derafu\Ubl\Translation\UblTranslationResourceProvider:
        tags: ['derafu_translation.resource_provider']
